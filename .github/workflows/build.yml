name: build-golems
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el ZIP del mod
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then echo "No hay ningun .zip en la raiz del repositorio"; exit 1; fi
          echo "Usando $ZIP"
          mkdir -p "$RUNNER_TEMP/mod"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/mod"
          SETTINGS=$(find "$RUNNER_TEMP/mod" -name settings.gradle -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "No se encontro settings.gradle dentro del ZIP"; exit 1; fi
          echo "MOD_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.0

      - name: Compilar
        working-directory: ${{ env.MOD_DIR }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: golems-legendarios-jar
          path: ${{ env.MOD_DIR }}/build/libs/*.jar
